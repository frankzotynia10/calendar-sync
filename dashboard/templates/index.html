<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Home Dashboard</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #111111;
    color: #f2f2f2;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  #calendar-view {
    display: block;
    width: 100%;
    min-height: 100%;
    padding: 20px;
  }

  #livetrack-view {
    display: none;
    width: 100%;
    height: 100%;
  }

  #livetrack-view iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .header-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 26px;
    font-weight: 600;
    margin: 0;
  }

  .clock {
    font-size: 15px;
    color: #999999;
  }

  /* Legend */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid #2a2a2a;
  }

  .legend-item {
    display: flex;
    align-items: center;
    font-size: 13px;
    color: #bbbbbb;
  }

  .legend-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    margin-right: 6px;
    flex-shrink: 0;
  }

  /* Week grid - desktop default: 7 columns */
  .week-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
  }

  .day-column {
    background: #1a1a1a;
    border-radius: 8px;
    padding: 10px;
    min-height: 120px;
  }

  .day-column-header {
    font-size: 13px;
    font-weight: 600;
    color: #dddddd;
    border-bottom: 1px solid #333333;
    padding-bottom: 6px;
    margin-bottom: 8px;
  }

  .day-column-header.is-today {
    color: #ffffff;
  }

  .day-column-header .weekday {
    display: block;
  }

  .day-column-header .date-num {
    display: block;
    color: #888888;
    font-weight: 400;
    font-size: 12px;
  }

  .event-row {
    display: flex;
    align-items: flex-start;
    padding: 4px 0;
    font-size: 12.5px;
    line-height: 1.3;
  }

  .event-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 6px;
    margin-top: 4px;
    flex-shrink: 0;
  }

  .event-text {
    flex: 1;
    min-width: 0;
  }

  .event-time {
    color: #999999;
    font-size: 11px;
    display: block;
  }

  .event-title {
    color: #f2f2f2;
    word-wrap: break-word;
  }

  .empty-state {
    color: #666666;
    font-size: 12px;
  }

  /* iPad breakpoint: 4 columns, wraps to 2 rows for a 7-day week */
  @media (max-width: 1023px) and (min-width: 768px) {
    .week-grid {
      grid-template-columns: repeat(4, 1fr);
    }
  }

  /* Mobile breakpoint: single column, stacked agenda */
  @media (max-width: 767px) {
    .week-grid {
      grid-template-columns: 1fr;
    }

    .day-column {
      min-height: unset;
    }

    h1 {
      font-size: 22px;
    }
  }
</style>
</head>
<body>

<div id="calendar-view">
  <div class="header-row">
    <h1 id="today-heading">Loading...</h1>
    <div class="clock" id="clock"></div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="week-grid" id="week-grid"></div>
</div>

<div id="livetrack-view">
  <iframe id="livetrack-frame" src=""></iframe>
</div>

<script>
  // Deliberately conservative JS below (no optional chaining, no nullish
  // coalescing, no arrow-function class fields) to stay compatible with
  // Safari 12 on older iPads.

  var SOURCE_META = {
    fz_o365:   { color: "#4a90d9", label: "Frank - Work" },
    cz_o365:   { color: "#d94a90", label: "Christina - Work" },
    fz_google: { color: "#4ad97a", label: "Frank - Personal" }
  };

  var DEFAULT_META = { color: "#999999", label: "Other" };

  function metaFor(sourceCal) {
    if (SOURCE_META.hasOwnProperty(sourceCal)) {
      return SOURCE_META[sourceCal];
    }
    return DEFAULT_META;
  }

  function easternDateKey(dateObj) {
    return dateObj.toLocaleDateString("en-US", {
      timeZone: "America/New_York",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    });
  }

  function formatTime(isoString) {
    var d = new Date(isoString);
    return d.toLocaleString("en-US", {
      timeZone: "America/New_York",
      hour: "numeric",
      minute: "2-digit"
    });
  }

  function buildLegend() {
    var legendEl = document.getElementById("legend");
    legendEl.innerHTML = "";

    var keys = ["fz_o365", "cz_o365", "fz_google"];
    for (var i = 0; i < keys.length; i++) {
      var meta = SOURCE_META[keys[i]];

      var item = document.createElement("div");
      item.className = "legend-item";

      var dot = document.createElement("div");
      dot.className = "legend-dot";
      dot.style.backgroundColor = meta.color;

      var label = document.createElement("span");
      label.textContent = meta.label;

      item.appendChild(dot);
      item.appendChild(label);
      legendEl.appendChild(item);
    }
  }

  function updateClock() {
    var now = new Date();
    var clockEl = document.getElementById("clock");
    var headingEl = document.getElementById("today-heading");

    clockEl.textContent = now.toLocaleTimeString("en-US", {
      timeZone: "America/New_York",
      hour: "numeric",
      minute: "2-digit",
      second: "2-digit"
    });

    headingEl.textContent = now.toLocaleDateString("en-US", {
      timeZone: "America/New_York",
      weekday: "long",
      month: "long",
      day: "numeric"
    });
  }

  // Builds the 7 day buckets: today (Eastern) through +6 days
  function buildWeekDays() {
    var days = [];
    var now = new Date();

    for (var i = 0; i < 7; i++) {
      var d = new Date(now.getTime());
      d.setUTCDate(d.getUTCDate() + i);

      var key = easternDateKey(d);
      var weekday = d.toLocaleDateString("en-US", { timeZone: "America/New_York", weekday: "short" });
      var dateNum = d.toLocaleDateString("en-US", { timeZone: "America/New_York", month: "short", day: "numeric" });

      days.push({ key: key, weekday: weekday, dateNum: dateNum, events: [] });
    }

    return days;
  }

  function renderWeek(events) {
    var grid = document.getElementById("week-grid");
    grid.innerHTML = "";

    var days = buildWeekDays();
    var todayKey = days[0].key;

    var byKey = {};
    for (var i = 0; i < days.length; i++) {
      byKey[days[i].key] = days[i];
    }

    for (var e = 0; e < events.length; e++) {
      var ev = events[e];
      var evDate = new Date(ev.start_time);
      var evKey = easternDateKey(evDate);

      if (byKey.hasOwnProperty(evKey)) {
        byKey[evKey].events.push(ev);
      }
    }

    for (var d = 0; d < days.length; d++) {
      var day = days[d];

      var col = document.createElement("div");
      col.className = "day-column";

      var header = document.createElement("div");
      header.className = "day-column-header" + (day.key === todayKey ? " is-today" : "");

      var weekdayEl = document.createElement("span");
      weekdayEl.className = "weekday";
      weekdayEl.textContent = day.key === todayKey ? "Today" : day.weekday;

      var dateEl = document.createElement("span");
      dateEl.className = "date-num";
      dateEl.textContent = day.dateNum;

      header.appendChild(weekdayEl);
      header.appendChild(dateEl);
      col.appendChild(header);

      if (day.events.length === 0) {
        var empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "\u2014";
        col.appendChild(empty);
      } else {
        for (var j = 0; j < day.events.length; j++) {
          var ev2 = day.events[j];
          var meta = metaFor(ev2.source_cal);

          var row = document.createElement("div");
          row.className = "event-row";

          var dot = document.createElement("div");
          dot.className = "event-dot";
          dot.style.backgroundColor = meta.color;

          var textWrap = document.createElement("div");
          textWrap.className = "event-text";

          var timeEl = document.createElement("span");
          timeEl.className = "event-time";
          timeEl.textContent = ev2.all_day ? "All day" : formatTime(ev2.start_time);

          var titleEl = document.createElement("span");
          titleEl.className = "event-title";
          titleEl.textContent = ev2.title ? ev2.title : "(untitled)";

          textWrap.appendChild(timeEl);
          textWrap.appendChild(titleEl);

          row.appendChild(dot);
          row.appendChild(textWrap);
          col.appendChild(row);
        }
      }

      grid.appendChild(col);
    }
  }

  function fetchEvents() {
    fetch("/api/events")
      .then(function (resp) { return resp.json(); })
      .then(function (data) { renderWeek(data.events); })
      .catch(function (err) { console.log("events fetch failed", err); });
  }

  var currentlyShowingLiveTrack = false;
  var currentLiveTrackUrl = null;

  function applyLiveTrackState(active, url) {
    var calendarView = document.getElementById("calendar-view");
    var liveTrackView = document.getElementById("livetrack-view");
    var frame = document.getElementById("livetrack-frame");

    if (active && url) {
      if (!currentlyShowingLiveTrack || currentLiveTrackUrl !== url) {
        frame.src = url;
        currentLiveTrackUrl = url;
      }
      calendarView.style.display = "none";
      liveTrackView.style.display = "block";
      currentlyShowingLiveTrack = true;
    } else {
      if (currentlyShowingLiveTrack) {
        frame.src = "about:blank";
        currentLiveTrackUrl = null;
      }
      calendarView.style.display = "block";
      liveTrackView.style.display = "none";
      currentlyShowingLiveTrack = false;
    }
  }

  function fetchLiveTrack() {
    fetch("/api/livetrack")
      .then(function (resp) { return resp.json(); })
      .then(function (data) { applyLiveTrackState(data.active, data.url); })
      .catch(function (err) { console.log("livetrack fetch failed", err); });
  }

  // Initial load
  buildLegend();
  updateClock();
  fetchEvents();
  fetchLiveTrack();

  // Refresh intervals
  setInterval(updateClock, 1000);
  setInterval(fetchEvents, 5 * 60 * 1000);
  setInterval(fetchLiveTrack, 30 * 1000);
</script>

</body>
</html>
