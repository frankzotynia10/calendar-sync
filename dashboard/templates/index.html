<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/frankzotynia10/calendar-sync/main/dashboard/calendar.png">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/frankzotynia10/calendar-sync/main/dashboard/calendar.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<title>Home Dashboard</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #111111;
    color: #f2f2f2;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  #calendar-view {
    display: block;
    width: 100%;
    height: 100%;
  }

  #livetrack-view {
    display: none;
    width: 100%;
    height: 100%;
  }

  #livetrack-view iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .top-bar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    padding: 14px 16px 10px 16px;
    position: -webkit-sticky;
    position: sticky;
    top: 0;
    z-index: 20;
    background: #111111;
  }

  .top-bar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0;
  }

  .clock {
    font-size: 14px;
    color: #999999;
  }

  .settings-btn {
    font-size: 18px;
    cursor: pointer;
    user-select: none;
    color: #999999;
    line-height: 1;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    padding: 0 16px 12px 16px;
    border-bottom: 1px solid #2a2a2a;
    position: -webkit-sticky;
    position: sticky;
    top: 44px;
    z-index: 19;
    background: #111111;
  }

  .legend-item {
    display: flex;
    align-items: center;
    font-size: 12px;
    color: #bbbbbb;
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 5px;
    flex-shrink: 0;
  }

  /* ===================== SETTINGS PANEL ===================== */
  #settings-panel {
    display: none;
    position: fixed;
    top: 48px;
    right: 16px;
    background: #1a1a1a;
    border: 1px solid #333333;
    border-radius: 8px;
    padding: 14px 16px;
    z-index: 1000;
    font-size: 13px;
    color: #dddddd;
    min-width: 220px;
  }

  #settings-panel.is-open {
    display: block;
  }

  .settings-row {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
  }

  .settings-row label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  #settings-close {
    margin-top: 2px;
    padding: 5px 12px;
    background: #333333;
    color: #ffffff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }

  /* ===================== AGENDA (mobile fallback) ===================== */
  #agenda-view {
    display: none;
    padding: 16px;
  }

  .day-group {
    margin-bottom: 22px;
  }

  .day-heading {
    font-size: 16px;
    font-weight: 600;
    color: #cccccc;
    border-bottom: 1px solid #333333;
    padding-bottom: 6px;
    margin-bottom: 8px;
  }

  .agenda-row {
    display: flex;
    align-items: flex-start;
    padding: 5px 0;
    font-size: 14px;
  }

  .agenda-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    margin-top: 5px;
    flex-shrink: 0;
  }

  .agenda-time {
    width: 80px;
    flex-shrink: 0;
    color: #999999;
    font-size: 12px;
  }

  .agenda-title {
    flex: 1;
  }

  .empty-state {
    color: #666666;
    font-size: 12px;
  }

  /* ===================== TIME GRID (tablet/desktop) ===================== */
  #timegrid-view {
    display: none;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    height: calc(100% - 96px);
  }

  .tg-inner {
    position: relative;
    /* min-width and column count are set inline via JS based on
       how many days are being shown (3 on tablet, 7 on desktop) */
  }

  .tg-row {
    display: grid;
    /* grid-template-columns set inline via JS to match day count */
  }

  .tg-header-row {
    position: -webkit-sticky;
    position: sticky;
    top: 0;
    z-index: 3;
    background: #111111;
    border-bottom: 1px solid #333333;
  }

  .tg-allday-row {
    position: -webkit-sticky;
    position: sticky;
    top: 34px;
    z-index: 2;
    background: #111111;
    border-bottom: 1px solid #2a2a2a;
    min-height: 20px;
  }

  .tg-gutter-cell {
    /* empty spacer above the time gutter, aligns with day headers */
  }

  .tg-day-header {
    font-size: 12px;
    font-weight: 600;
    color: #cccccc;
    text-align: center;
    padding: 6px 2px;
  }

  .tg-day-header.is-today {
    color: #ffffff;
    background: #1c2733;
  }

  .tg-day-header .dow {
    display: block;
  }

  .tg-day-header .dnum {
    display: block;
    font-weight: 400;
    color: #888888;
    font-size: 11px;
  }

  .tg-day-header.is-today .dnum {
    color: #bbbbbb;
  }

  .tg-allday-cell {
    padding: 2px 3px;
  }

  .tg-allday-chip {
    font-size: 9.5px;
    color: #ffffff;
    border-radius: 3px;
    padding: 1px 4px;
    margin-bottom: 2px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .tg-body-row {
    position: relative;
  }

  .tg-gutter {
    position: relative;
  }

  .tg-hour-label {
    position: absolute;
    left: 0;
    right: 4px;
    text-align: right;
    font-size: 10px;
    color: #777777;
    transform: translateY(-6px);
  }

  .tg-day-col {
    position: relative;
    border-left: 1px solid #232323;
    background-image: linear-gradient(to bottom, #232323 1px, transparent 1px);
  }

  .tg-day-col.is-today {
    background-color: rgba(255, 255, 255, 0.02);
  }

  .tg-event {
    position: absolute;
    border-radius: 4px;
    padding: 2px 4px;
    overflow: hidden;
    font-size: 10.5px;
    line-height: 1.25;
    color: #ffffff;
  }

  .tg-event .tg-event-time {
    display: block;
    font-size: 9px;
    opacity: 0.85;
  }

  .tg-event .tg-event-title {
    display: block;
    font-weight: 600;
    word-wrap: break-word;
  }

  .tg-now-line {
    position: absolute;
    left: 0;
    right: 0;
    height: 0;
    border-top: 1px solid #e04a4a;
    z-index: 1;
  }

  .tg-now-dot {
    position: absolute;
    left: -4px;
    top: -4px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #e04a4a;
  }

  /* "Up next" highlight - the single soonest upcoming timed event */
  .tg-event.is-next {
    box-shadow: 0 0 0 2px #ffffff, 0 0 10px rgba(255, 255, 255, 0.5);
    z-index: 2;
  }

  .agenda-row.is-next .agenda-title {
    font-weight: 700;
    color: #ffffff;
  }

  .agenda-row.is-next .agenda-time {
    color: #ffffff;
  }

  .agenda-row.is-next {
    background: rgba(255, 255, 255, 0.06);
    border-radius: 4px;
  }

  /* ===================== SCREENSAVER (overnight idle) ===================== */
  #screensaver {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    z-index: 999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  #screensaver.is-active {
    display: flex;
  }

  #screensaver-clock {
    font-size: 72px;
    font-weight: 300;
    color: #3a3a3a;
  }

  #screensaver-date {
    font-size: 20px;
    color: #2a2a2a;
    margin-top: 8px;
  }

  /* ===================== LIGHT THEME ===================== */
  body.light-theme,
  body.light-theme html {
    background: #f4f4f4;
    color: #1a1a1a;
  }

  body.light-theme .top-bar,
  body.light-theme .legend,
  body.light-theme .tg-header-row,
  body.light-theme .tg-allday-row {
    background: #f4f4f4;
  }

  body.light-theme .clock {
    color: #666666;
  }

  body.light-theme .settings-btn {
    color: #666666;
  }

  body.light-theme .legend {
    border-bottom-color: #dddddd;
  }

  body.light-theme .legend-item {
    color: #333333;
  }

  body.light-theme #settings-panel {
    background: #ffffff;
    border-color: #dddddd;
    color: #222222;
  }

  body.light-theme #settings-close {
    background: #e5e5e5;
    color: #222222;
  }

  body.light-theme .day-heading {
    color: #333333;
    border-bottom-color: #cccccc;
  }

  body.light-theme .agenda-time {
    color: #666666;
  }

  body.light-theme .empty-state {
    color: #999999;
  }

  body.light-theme .agenda-row.is-next {
    background: rgba(0, 0, 0, 0.05);
  }

  body.light-theme .agenda-row.is-next .agenda-title,
  body.light-theme .agenda-row.is-next .agenda-time {
    color: #000000;
  }

  body.light-theme .tg-header-row,
  body.light-theme .tg-allday-row {
    border-bottom-color: #dddddd;
  }

  body.light-theme .tg-day-header {
    color: #333333;
  }

  body.light-theme .tg-day-header.is-today {
    background: #dbe9fa;
    color: #111111;
  }

  body.light-theme .tg-day-header .dnum {
    color: #777777;
  }

  body.light-theme .tg-day-header.is-today .dnum {
    color: #333333;
  }

  body.light-theme .tg-hour-label {
    color: #888888;
  }

  body.light-theme .tg-day-col {
    border-left-color: #e2e2e2;
    background-image: linear-gradient(to bottom, #e2e2e2 1px, transparent 1px);
  }

  body.light-theme .tg-day-col.is-today {
    background-color: rgba(0, 0, 0, 0.02);
  }

  /* ===================== Breakpoints ===================== */

  /* Mobile: agenda list only */
  @media (max-width: 767px) {
    #timegrid-view { display: none !important; }
    #agenda-view { display: block !important; }
    h1 { font-size: 20px; }
  }

  /* Tablet/desktop: time grid (3 days on tablet, 7 on desktop - see
     getDaysToShow() in JS, which drives the actual column count) */
  @media (min-width: 768px) {
    #timegrid-view { display: block !important; }
    #agenda-view { display: none !important; }
  }
</style>
</head>
<body>

<div id="calendar-view">
  <div class="top-bar">
    <h1 id="today-heading">Loading...</h1>
    <div class="top-bar-right">
      <div class="clock" id="clock"></div>
      <div class="settings-btn" id="settings-btn" title="Settings">&#9881;</div>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div id="timegrid-view"></div>
  <div id="agenda-view"></div>
</div>

<div id="livetrack-view">
  <iframe id="livetrack-frame" src=""></iframe>
</div>

<div id="screensaver">
  <div id="screensaver-clock">--:--</div>
  <div id="screensaver-date">Loading...</div>
</div>

<div id="settings-panel">
  <div class="settings-row">
    <label>
      <input type="checkbox" id="setting-screensaver">
      Night screensaver (9PM&ndash;5:30AM)
    </label>
  </div>
  <div class="settings-row">
    <label>
      <input type="checkbox" id="setting-lightmode">
      Light mode
    </label>
  </div>
  <button id="settings-close">Close</button>
</div>

<script>
  // Deliberately conservative JS below (no optional chaining, no nullish
  // coalescing, no arrow-function class fields, no formatToParts) to stay
  // compatible with Safari 12 on older iPads.

  var START_HOUR = 6;   // grid starts at 6 AM
  var END_HOUR = 23;    // grid ends at 11 PM
  var PX_PER_HOUR = 60;
  var PX_PER_MIN = PX_PER_HOUR / 60;
  var TOTAL_MIN = (END_HOUR - START_HOUR) * 60;
  var TOTAL_HEIGHT = TOTAL_MIN * PX_PER_MIN;

  // Desktop-width viewports show a full week; narrower (tablet) viewports
  // show a shorter 3-day window. Mobile falls back to the agenda list
  // entirely (see CSS breakpoints) so it isn't handled here.
  //
  // Set comfortably above 1536 deliberately: that's the iPad Air 1's
  // resolution, and iPad landscape widths in general (Mini/Air 9.7"
  // family lands at 1024 CSS px) should never be misclassified as
  // "desktop" and shown the cramped 7-day view.
  var DESKTOP_MIN_WIDTH = 1600;
  var DAYS_DESKTOP = 7;
  var DAYS_TABLET = 3;
  var MIN_WIDTH_PER_DAY = 100; // px, used to size the scrollable inner container

  function getDaysToShow() {
    return (window.innerWidth >= DESKTOP_MIN_WIDTH) ? DAYS_DESKTOP : DAYS_TABLET;
  }

  var SOURCE_META = {};
  var DEFAULT_META = { color: "#999999", label: "Other" };

  function metaFor(sourceCal) {
    if (SOURCE_META.hasOwnProperty(sourceCal)) {
      return SOURCE_META[sourceCal];
    }
    return DEFAULT_META;
  }

  function fetchCalendarMeta(onDone) {
    fetch("/api/calendar-meta")
      .then(function (resp) { return resp.json(); })
      .then(function (data) {
        SOURCE_META = data.sources || {};
        if (data["default"]) { DEFAULT_META = data["default"]; }
        if (onDone) { onDone(); }
      })
      .catch(function (err) {
        console.log("calendar meta fetch failed", err);
        if (onDone) { onDone(); }
      });
  }

  function easternDateKey(dateObj) {
    return dateObj.toLocaleDateString("en-US", {
      timeZone: "America/New_York",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    });
  }

  // Returns {hour, minute} in Eastern time. Deliberately requests 12-hour
  // format and converts manually, rather than requesting hour12:false -
  // older Safari (iOS 12) has known Intl bugs where hour12:false isn't
  // always honored, silently returning 12-hour strings instead. Since that
  // caused PM times to be misread as their AM-equivalent hour (e.g. 3:15 PM
  // read as hour=3), it could push isNightWindow() into false positives
  // during the day. 12-hour + explicit AM/PM parsing avoids that class of
  // bug entirely, since hour12:true is the universally well-supported path.
  function easternHourMinute(dateObj) {
    var s = dateObj.toLocaleTimeString("en-US", {
      timeZone: "America/New_York",
      hour12: true,
      hour: "numeric",
      minute: "2-digit"
    });
    var isPM = /PM/i.test(s);
    var isAM = /AM/i.test(s);
    var cleaned = s.replace(/[AP]M/i, "").trim();
    var parts = cleaned.split(":");
    var hour = parseInt(parts[0], 10);
    var minute = parseInt(parts[1], 10);
    if (isPM && hour !== 12) { hour += 12; }
    if (isAM && hour === 12) { hour = 0; }
    return { hour: hour, minute: minute };
  }

  function formatTime12h(hour, minute) {
    var h = hour % 12;
    if (h === 0) { h = 12; }
    var ampm = hour < 12 ? "AM" : "PM";
    var mm = minute < 10 ? "0" + minute : "" + minute;
    return h + ":" + mm + " " + ampm;
  }

  function buildLegend() {
    var legendEl = document.getElementById("legend");
    legendEl.innerHTML = "";

    var keys = Object.keys(SOURCE_META);
    for (var i = 0; i < keys.length; i++) {
      var meta = SOURCE_META[keys[i]];

      var item = document.createElement("div");
      item.className = "legend-item";

      var dot = document.createElement("div");
      dot.className = "legend-dot";
      dot.style.backgroundColor = meta.color;

      var label = document.createElement("span");
      label.textContent = meta.label;

      item.appendChild(dot);
      item.appendChild(label);
      legendEl.appendChild(item);
    }
  }

  function updateClock() {
    var now = new Date();
    document.getElementById("clock").textContent = now.toLocaleTimeString("en-US", {
      timeZone: "America/New_York",
      hour: "numeric",
      minute: "2-digit",
      second: "2-digit"
    });
    document.getElementById("today-heading").textContent = now.toLocaleDateString("en-US", {
      timeZone: "America/New_York",
      weekday: "long",
      month: "long",
      day: "numeric"
    });
  }

  // Builds day buckets: today (Eastern) through +N-1 days, where N comes
  // from getDaysToShow() (re-evaluated on every call, so it responds to
  // viewport width at render time).
  function buildWeekDays() {
    var days = [];
    var now = new Date();
    var daysToShow = getDaysToShow();

    for (var i = 0; i < daysToShow; i++) {
      var d = new Date(now.getTime());
      d.setUTCDate(d.getUTCDate() + i);

      var key = easternDateKey(d);
      var weekday = d.toLocaleDateString("en-US", { timeZone: "America/New_York", weekday: "short" });
      var dateNum = d.toLocaleDateString("en-US", { timeZone: "America/New_York", month: "short", day: "numeric" });

      days.push({ key: key, weekday: weekday, dateNum: dateNum, timed: [], allDay: [] });
    }
    return days;
  }

  function bucketEvents(events) {
    var days = buildWeekDays();
    var byKey = {};
    for (var i = 0; i < days.length; i++) { byKey[days[i].key] = days[i]; }

    for (var e = 0; e < events.length; e++) {
      var ev = events[e];
      var evKey = easternDateKey(new Date(ev.start_time));
      if (!byKey.hasOwnProperty(evKey)) { continue; }

      if (ev.all_day) {
        byKey[evKey].allDay.push(ev);
      } else {
        byKey[evKey].timed.push(ev);
      }
    }
    return days;
  }

  // Identifies the single soonest upcoming timed event (across all loaded
  // events, not just the visible window) so it can be visually highlighted
  // as "up next" in both the time grid and the agenda view.
  var NEXT_EVENT_KEY = null;

  function eventKey(ev) {
    return ev.source_cal + "|" + ev.start_time;
  }

  function computeNextEventKey(events) {
    var now = new Date();
    var best = null;
    var bestTime = null;

    for (var i = 0; i < events.length; i++) {
      var ev = events[i];
      if (ev.all_day) { continue; }

      var start = new Date(ev.start_time);
      if (start >= now) {
        if (best === null || start < bestTime) {
          best = ev;
          bestTime = start;
        }
      }
    }

    return best ? eventKey(best) : null;
  }

  function isNextEvent(ev) {
    return NEXT_EVENT_KEY !== null && eventKey(ev) === NEXT_EVENT_KEY;
  }

  // Assigns column index + column count (for overlap-safe width division)
  // to each timed event within a single day.
  function layoutDayEvents(rawEvents) {
    var events = [];
    for (var i = 0; i < rawEvents.length; i++) {
      var ev = rawEvents[i];
      var s = easternHourMinute(new Date(ev.start_time));
      var startMin = (s.hour - START_HOUR) * 60 + s.minute;

      var endMin;
      if (ev.end_time) {
        var eObj = easternHourMinute(new Date(ev.end_time));
        endMin = (eObj.hour - START_HOUR) * 60 + eObj.minute;
      } else {
        endMin = startMin + 30;
      }

      if (endMin <= startMin) { endMin = startMin + 30; }

      startMin = Math.max(0, Math.min(startMin, TOTAL_MIN));
      endMin = Math.max(0, Math.min(endMin, TOTAL_MIN));
      if (endMin - startMin < 15) { endMin = startMin + 15; }

      events.push({
        source_cal: ev.source_cal,
        title: ev.title,
        start_time: ev.start_time,
        startHour: s.hour,
        startMinute: s.minute,
        startMin: startMin,
        endMin: endMin,
        col: 0,
        colCount: 1
      });
    }

    events.sort(function (a, b) {
      if (a.startMin !== b.startMin) { return a.startMin - b.startMin; }
      return a.endMin - b.endMin;
    });

    var columns = [];
    for (var j = 0; j < events.length; j++) {
      var ev2 = events[j];
      var placed = false;
      for (var c = 0; c < columns.length; c++) {
        if (columns[c] <= ev2.startMin) {
          ev2.col = c;
          columns[c] = ev2.endMin;
          placed = true;
          break;
        }
      }
      if (!placed) {
        ev2.col = columns.length;
        columns.push(ev2.endMin);
      }
    }

    for (var k = 0; k < events.length; k++) {
      var e1 = events[k];
      var maxCol = e1.col;
      for (var m = 0; m < events.length; m++) {
        var e2 = events[m];
        if (e2.startMin < e1.endMin && e2.endMin > e1.startMin) {
          if (e2.col > maxCol) { maxCol = e2.col; }
        }
      }
      e1.colCount = maxCol + 1;
    }

    return events;
  }

  function buildHourGutter() {
    var gutter = document.createElement("div");
    gutter.className = "tg-gutter";
    gutter.style.height = TOTAL_HEIGHT + "px";

    for (var h = START_HOUR; h <= END_HOUR; h++) {
      var label = document.createElement("div");
      label.className = "tg-hour-label";
      label.style.top = ((h - START_HOUR) * PX_PER_HOUR) + "px";
      label.textContent = formatTime12h(h, 0).replace(":00", "");
      gutter.appendChild(label);
    }
    return gutter;
  }

  function buildDayColumn(day, isToday) {
    var col = document.createElement("div");
    col.className = "tg-day-col" + (isToday ? " is-today" : "");
    col.style.height = TOTAL_HEIGHT + "px";
    col.style.backgroundSize = "100% " + (PX_PER_HOUR / 2) + "px";

    var laidOut = layoutDayEvents(day.timed);

    for (var i = 0; i < laidOut.length; i++) {
      var ev = laidOut[i];
      var meta = metaFor(ev.source_cal);

      var block = document.createElement("div");
      block.className = "tg-event" + (isNextEvent(ev) ? " is-next" : "");
      block.style.top = (ev.startMin * PX_PER_MIN) + "px";
      block.style.height = ((ev.endMin - ev.startMin) * PX_PER_MIN - 1) + "px";

      var widthPct = 100 / ev.colCount;
      var leftPct = ev.col * widthPct;
      block.style.left = leftPct + "%";
      block.style.width = (widthPct - 1) + "%";
      block.style.backgroundColor = meta.color;

      var timeEl = document.createElement("span");
      timeEl.className = "tg-event-time";
      timeEl.textContent = formatTime12h(ev.startHour, ev.startMinute);

      var titleEl = document.createElement("span");
      titleEl.className = "tg-event-title";
      titleEl.textContent = ev.title ? ev.title : "(untitled)";

      block.appendChild(timeEl);
      block.appendChild(titleEl);
      col.appendChild(block);
    }

    if (isToday) {
      var nowE = easternHourMinute(new Date());
      var nowMin = (nowE.hour - START_HOUR) * 60 + nowE.minute;
      if (nowMin >= 0 && nowMin <= TOTAL_MIN) {
        var nowLine = document.createElement("div");
        nowLine.className = "tg-now-line";
        nowLine.style.top = (nowMin * PX_PER_MIN) + "px";
        var nowDot = document.createElement("div");
        nowDot.className = "tg-now-dot";
        nowLine.appendChild(nowDot);
        col.appendChild(nowLine);
      }
    }

    return col;
  }

  function renderTimeGrid(events) {
    var container = document.getElementById("timegrid-view");
    var prevScroll = container.scrollTop;
    var alreadyScrolled = container.hasAttribute("data-scrolled");
    container.innerHTML = "";

    var days = bucketEvents(events);
    var todayKey = days[0].key;
    var colTemplate = "46px repeat(" + days.length + ", 1fr)";
    var innerMinWidth = (46 + days.length * MIN_WIDTH_PER_DAY) + "px";

    var inner = document.createElement("div");
    inner.className = "tg-inner";
    inner.style.minWidth = innerMinWidth;

    // Header row (weekday + date per day)
    var headerRow = document.createElement("div");
    headerRow.className = "tg-row tg-header-row";
    headerRow.style.gridTemplateColumns = colTemplate;
    headerRow.appendChild(document.createElement("div")).className = "tg-gutter-cell";

    for (var i = 0; i < days.length; i++) {
      var day = days[i];
      var isToday = day.key === todayKey;

      var headerCell = document.createElement("div");
      headerCell.className = "tg-day-header" + (isToday ? " is-today" : "");

      var dow = document.createElement("span");
      dow.className = "dow";
      dow.textContent = isToday ? "Today" : day.weekday;

      var dnum = document.createElement("span");
      dnum.className = "dnum";
      dnum.textContent = day.dateNum;

      headerCell.appendChild(dow);
      headerCell.appendChild(dnum);
      headerRow.appendChild(headerCell);
    }
    inner.appendChild(headerRow);

    // All-day strip
    var alldayRow = document.createElement("div");
    alldayRow.className = "tg-row tg-allday-row";
    alldayRow.style.gridTemplateColumns = colTemplate;
    alldayRow.appendChild(document.createElement("div")).className = "tg-gutter-cell";

    for (var j = 0; j < days.length; j++) {
      var dayA = days[j];
      var cell = document.createElement("div");
      cell.className = "tg-allday-cell";

      for (var a = 0; a < dayA.allDay.length; a++) {
        var adEv = dayA.allDay[a];
        var meta = metaFor(adEv.source_cal);
        var chip = document.createElement("div");
        chip.className = "tg-allday-chip";
        chip.style.backgroundColor = meta.color;
        chip.textContent = adEv.title ? adEv.title : "(untitled)";
        cell.appendChild(chip);
      }
      alldayRow.appendChild(cell);
    }
    inner.appendChild(alldayRow);

    // Time-grid body
    var bodyRow = document.createElement("div");
    bodyRow.className = "tg-row tg-body-row";
    bodyRow.style.gridTemplateColumns = colTemplate;
    bodyRow.appendChild(buildHourGutter());

    for (var d = 0; d < days.length; d++) {
      var isTodayCol = days[d].key === todayKey;
      bodyRow.appendChild(buildDayColumn(days[d], isTodayCol));
    }
    inner.appendChild(bodyRow);

    container.appendChild(inner);

    // First render only: auto-scroll to a sensible starting hour.
    // Subsequent re-renders (data refresh, now-line tick) preserve
    // whatever scroll position was already there.
    if (!alreadyScrolled) {
      var scrollToHour = 7;
      container.scrollTop = Math.max(0, (scrollToHour - START_HOUR) * PX_PER_HOUR - 20);
      container.setAttribute("data-scrolled", "true");
    } else {
      container.scrollTop = prevScroll;
    }
  }

  function renderAgenda(events) {
    var container = document.getElementById("agenda-view");
    container.innerHTML = "";

    var days = bucketEvents(events);
    var todayKey = days[0].key;

    for (var d = 0; d < days.length; d++) {
      var day = days[d];
      var allEvents = day.allDay.concat(day.timed);

      var group = document.createElement("div");
      group.className = "day-group";

      var heading = document.createElement("div");
      heading.className = "day-heading";
      heading.textContent = (day.key === todayKey ? "Today - " : "") + day.weekday + " " + day.dateNum;
      group.appendChild(heading);

      if (allEvents.length === 0) {
        var empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "Nothing scheduled.";
        group.appendChild(empty);
      } else {
        allEvents.sort(function (a, b) {
          if (a.all_day && !b.all_day) { return -1; }
          if (!a.all_day && b.all_day) { return 1; }
          return new Date(a.start_time) - new Date(b.start_time);
        });

        for (var e = 0; e < allEvents.length; e++) {
          var ev = allEvents[e];
          var meta = metaFor(ev.source_cal);

          var row = document.createElement("div");
          row.className = "agenda-row" + (isNextEvent(ev) ? " is-next" : "");

          var dot = document.createElement("div");
          dot.className = "agenda-dot";
          dot.style.backgroundColor = meta.color;

          var timeEl = document.createElement("div");
          timeEl.className = "agenda-time";
          if (ev.all_day) {
            timeEl.textContent = "All day";
          } else {
            var hm = easternHourMinute(new Date(ev.start_time));
            timeEl.textContent = formatTime12h(hm.hour, hm.minute);
          }

          var titleEl = document.createElement("div");
          titleEl.className = "agenda-title";
          titleEl.textContent = ev.title ? ev.title : "(untitled)";

          row.appendChild(dot);
          row.appendChild(timeEl);
          row.appendChild(titleEl);
          group.appendChild(row);
        }
      }

      container.appendChild(group);
    }
  }

  var lastEvents = [];

  function renderAll(events) {
    lastEvents = events;
    NEXT_EVENT_KEY = computeNextEventKey(events);
    renderTimeGrid(events);
    renderAgenda(events);
  }

  function fetchEvents() {
    fetch("/api/events")
      .then(function (resp) { return resp.json(); })
      .then(function (data) { renderAll(data.events); })
      .catch(function (err) { console.log("events fetch failed", err); });
  }

  var currentlyShowingLiveTrack = false;
  var currentLiveTrackUrl = null;

  function applyLiveTrackState(active, url) {
    var calendarView = document.getElementById("calendar-view");
    var liveTrackView = document.getElementById("livetrack-view");
    var frame = document.getElementById("livetrack-frame");

    if (active && url) {
      if (!currentlyShowingLiveTrack || currentLiveTrackUrl !== url) {
        frame.src = url;
        currentLiveTrackUrl = url;
      }
      calendarView.style.display = "none";
      liveTrackView.style.display = "block";
      currentlyShowingLiveTrack = true;
    } else {
      if (currentlyShowingLiveTrack) {
        frame.src = "about:blank";
        currentLiveTrackUrl = null;
      }
      calendarView.style.display = "block";
      liveTrackView.style.display = "none";
      currentlyShowingLiveTrack = false;
    }
  }

  function fetchLiveTrack() {
    fetch("/api/livetrack")
      .then(function (resp) { return resp.json(); })
      .then(function (data) { applyLiveTrackState(data.active, data.url); })
      .catch(function (err) { console.log("livetrack fetch failed", err); });
  }

  // Re-render the now-line position periodically without a full data refetch
  function tickNowLine() {
    renderTimeGrid(lastEvents);
  }

  // Re-render if the viewport crosses the tablet/desktop day-count
  // threshold (e.g. resizing a browser window, or rotating a device that
  // happens to sit right at the boundary). Debounced to avoid thrashing
  // during a drag-resize.
  var lastDaysToShow = getDaysToShow();
  var resizeDebounce = null;

  function handleResize() {
    if (resizeDebounce) { clearTimeout(resizeDebounce); }
    resizeDebounce = setTimeout(function () {
      var newDaysToShow = getDaysToShow();
      if (newDaysToShow !== lastDaysToShow) {
        lastDaysToShow = newDaysToShow;
        renderAll(lastEvents);
      }
    }, 250);
  }

  window.addEventListener("resize", handleResize);

  // ===================== SETTINGS (persisted via localStorage) =====================
  // Not an artifact/sandbox context - this is a normal deployed webpage,
  // so localStorage is fine here (and is the simplest way to persist a
  // per-device display preference across reloads without a backend change).
  var SETTINGS_KEY = "dashboardSettings";
  var DEFAULT_SETTINGS = { screensaverEnabled: true, lightMode: false };

  function loadSettings() {
    try {
      var raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) { return DEFAULT_SETTINGS; }
      var parsed = JSON.parse(raw);
      return {
        screensaverEnabled: parsed.screensaverEnabled !== undefined ? parsed.screensaverEnabled : true,
        lightMode: parsed.lightMode !== undefined ? parsed.lightMode : false
      };
    } catch (e) {
      return DEFAULT_SETTINGS;
    }
  }

  function saveSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    } catch (e) {
      console.log("could not save settings", e);
    }
  }

  var settings = loadSettings();

  function applyTheme() {
    document.body.className = settings.lightMode ? "light-theme" : "";
  }

  function applySettingsToUI() {
    document.getElementById("setting-screensaver").checked = settings.screensaverEnabled;
    document.getElementById("setting-lightmode").checked = settings.lightMode;
  }

  function toggleSettingsPanel() {
    var panel = document.getElementById("settings-panel");
    panel.className = (panel.className === "is-open") ? "" : "is-open";
  }

  function closeSettingsPanel() {
    document.getElementById("settings-panel").className = "";
  }

  // ===================== SCREENSAVER (overnight idle) =====================
  // Active window: 9:00 PM through 5:30 AM Eastern. Outside that window
  // the screensaver never triggers, no matter how idle the display is.
  // Can also be disabled entirely via the settings panel.
  var NIGHT_START_MIN = 21 * 60;       // 9:00 PM
  var NIGHT_END_MIN = 5 * 60 + 30;     // 5:30 AM
  var IDLE_TIMEOUT_MS = 5 * 60 * 1000; // 5 minutes

  var lastInteraction = Date.now();
  var screensaverActive = false;

  function isNightWindow() {
    var hm = easternHourMinute(new Date());
    var totalMin = hm.hour * 60 + hm.minute;
    // Window wraps midnight: true if at/after 9PM OR before 5:30AM
    return (totalMin >= NIGHT_START_MIN) || (totalMin < NIGHT_END_MIN);
  }

  function showScreensaver() {
    if (screensaverActive) { return; }
    screensaverActive = true;
    document.getElementById("screensaver").className = "is-active";
  }

  function hideScreensaver() {
    if (!screensaverActive) { return; }
    screensaverActive = false;
    document.getElementById("screensaver").className = "";
  }

  function updateScreensaverClock() {
    var now = new Date();
    document.getElementById("screensaver-clock").textContent = now.toLocaleTimeString("en-US", {
      timeZone: "America/New_York",
      hour: "numeric",
      minute: "2-digit"
    });
    document.getElementById("screensaver-date").textContent = now.toLocaleDateString("en-US", {
      timeZone: "America/New_York",
      weekday: "long",
      month: "long",
      day: "numeric"
    });
  }

  function registerInteraction() {
    lastInteraction = Date.now();
    if (screensaverActive) { hideScreensaver(); }
  }

  document.addEventListener("touchstart", registerInteraction);
  document.addEventListener("mousedown", registerInteraction);
  document.addEventListener("keydown", registerInteraction);

  function checkIdleForScreensaver() {
    if (!settings.screensaverEnabled) { return; }
    if (screensaverActive) { return; }
    if (currentlyShowingLiveTrack) { return; } // never screensaver over an active LiveTrack session
    if (isNightWindow() && (Date.now() - lastInteraction) > IDLE_TIMEOUT_MS) {
      showScreensaver();
    }
  }

  // Wire up settings panel controls
  document.getElementById("settings-btn").addEventListener("click", toggleSettingsPanel);
  document.getElementById("settings-close").addEventListener("click", closeSettingsPanel);

  document.getElementById("setting-screensaver").addEventListener("change", function (e) {
    settings.screensaverEnabled = e.target.checked;
    saveSettings();
    if (!settings.screensaverEnabled) { hideScreensaver(); }
  });

  document.getElementById("setting-lightmode").addEventListener("change", function (e) {
    settings.lightMode = e.target.checked;
    saveSettings();
    applyTheme();
  });

  // Initial load
  applyTheme();
  applySettingsToUI();
  updateClock();
  fetchCalendarMeta(function () {
    buildLegend();
    fetchEvents();
  });
  fetchLiveTrack();

  // Refresh intervals
  setInterval(updateClock, 1000);
  setInterval(fetchEvents, 5 * 60 * 1000);
  setInterval(fetchLiveTrack, 30 * 1000);
  setInterval(tickNowLine, 60 * 1000);
  setInterval(updateScreensaverClock, 1000);
  setInterval(checkIdleForScreensaver, 15 * 1000);
</script>

</body>
</html>
